<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Interactive 3D Education Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* =========================================================
   VARIABEL & DASAR
   ========================================================= */
:root{
  --neon:#a8ff60; --neon-d:#6fd13a; --bg:#05080a;
  --glass:rgba(14,20,24,.48); --line:rgba(255,255,255,.14);
  --txt:#e8eef0; --mute:#b4bec2;
  --chamfer:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
  --chamfer-s:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none}
button:focus-visible{outline:1px dashed var(--neon);outline-offset:3px}

/* =========================================================
   LATAR HALAMAN (di luar jendela)
   ========================================================= */
#page-bg{position:fixed;inset:-30px;z-index:0;overflow:hidden;transition:transform .6s ease-out}
#page-bg .streak{position:absolute;filter:blur(26px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
#page-bg .s1{top:2%;right:4%;width:38vw;height:16vh;background:linear-gradient(90deg,transparent,rgba(40,170,200,.55),rgba(120,220,255,.25),transparent)}
#page-bg .s2{top:10%;right:-4%;width:22vw;height:6vh;background:rgba(80,200,230,.5);animation-duration:11s}
#page-bg .s3{bottom:6%;left:8%;width:30vw;height:10vh;background:linear-gradient(90deg,transparent,rgba(30,90,140,.5),transparent);animation-duration:19s}
#page-bg .s4{top:40%;left:-6%;width:16vw;height:30vh;background:rgba(20,60,80,.45);animation-duration:23s}
#page-bg .pix{position:absolute;height:3px;background:rgba(150,220,255,.35);filter:blur(1px);animation:pix 4s steps(4) infinite}
@keyframes drift{to{transform:translate3d(-4vw,2vh,0) scaleX(1.2)}}
@keyframes pix{0%,100%{opacity:.15}50%{opacity:.6;transform:translateX(20px)}}

/* Grain, scanline CRT, glitch layer */
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:60;opacity:.075;animation:grain .8s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.crt{position:fixed;inset:0;pointer-events:none;z-index:61;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0,rgba(255,255,255,.028) 1px,transparent 1px,transparent 3px)}
.crt::after{content:'';position:absolute;left:0;right:0;height:18vh;background:linear-gradient(to bottom,transparent,rgba(168,255,96,.035),transparent);animation:crtband 7s linear infinite}
@keyframes crtband{from{top:-20vh}to{top:110vh}}
.glitch-layer{position:fixed;inset:0;pointer-events:none;z-index:62;overflow:hidden}
.gbar{position:absolute;mix-blend-mode:screen;opacity:.85}
.edge-line{position:absolute;height:2px;mix-blend-mode:screen;animation:edgeblink 5s steps(1) infinite}
.edge-line.l1{top:18%;left:0;width:9vw;background:rgba(255,30,70,.7);animation-delay:-1s}
.edge-line.l2{top:63%;right:0;width:12vw;background:rgba(40,190,255,.7);animation-delay:-2.7s}
.edge-line.l3{top:84%;left:0;width:5vw;background:rgba(40,190,255,.6);animation-delay:-3.6s}
.edge-line.l4{top:31%;right:0;width:6vw;background:rgba(255,30,70,.6);animation-delay:-.4s}
@keyframes edgeblink{0%,88%,100%{opacity:0}89%{opacity:1}91%{opacity:0}93%{opacity:.8;transform:translateX(8px)}95%{opacity:0}}

/* =========================================================
   JENDELA BROWSER UTAMA
   ========================================================= */
#frame{position:fixed;inset:5vh 4.5vw;border-radius:22px;border:1.5px solid rgba(255,255,255,.30);overflow:hidden;z-index:2;
  background:rgba(10,16,20,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(120,255,200,.06),0 0 32px rgba(70,200,230,.20),0 0 110px rgba(140,255,120,.08),inset 0 0 70px rgba(0,0,0,.55);
  transition:transform .08s}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}
#bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:blur(9px) contrast(1.6) brightness(1.15);mix-blend-mode:screen;opacity:.6}
.fx-grad{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse 34% 14% at 50% 86%,rgba(160,215,255,.13),transparent 70%),radial-gradient(ellipse 26% 46% at 52% 48%,rgba(168,255,96,.05),transparent 70%),linear-gradient(180deg,rgba(80,170,200,.06),transparent 30%)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.7) 100%)}
.sheen{position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,rgba(210,255,180,.55),rgba(168,255,96,.12) 35%,transparent 65%);mix-blend-mode:screen}
.flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* Elemen UI disembunyikan saat intro */
.ui{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
#frame:not(.ui-in) .ui{opacity:0;pointer-events:none}
#frame:not(.ui-in) .ui.from-l{transform:translateX(-30px)}
#frame:not(.ui-in) .ui.from-r{transform:translateX(30px)}
#frame:not(.ui-in) .ui.from-t{transform:translateY(-20px)}
#frame:not(.ui-in) .ui.from-b{transform:translateY(20px)}

/* Logo */
.logo{position:absolute;top:22px;left:24px;width:46px;height:46px;border-radius:50%;background:var(--neon);display:grid;place-items:center;z-index:10;box-shadow:0 0 18px rgba(168,255,96,.45)}
.logo svg{width:26px;height:26px}
.logo:hover{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(168,255,96,.45),0 0 0 0 rgba(168,255,96,.5)}50%{box-shadow:0 0 30px rgba(168,255,96,.9),0 0 0 10px rgba(168,255,96,0)}}

/* Navigasi pill */
.navpill{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:14px;background:rgba(22,28,32,.55);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
#frame:not(.ui-in) .navpill{transform:translate(-50%,-20px)}
.navpill button{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.62);transition:.25s}
.navpill button:hover{color:#fff;background:rgba(255,255,255,.06)}
.navpill button.active{color:var(--neon);background:rgba(168,255,96,.1);box-shadow:0 0 16px rgba(168,255,96,.35),inset 0 0 0 1px rgba(168,255,96,.4)}
.navpill svg{width:18px;height:18px}

/* Tombol MENU */
.menu-btn{position:absolute;top:20px;right:22px;display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;background:rgba(22,28,32,.55);border:1px solid rgba(255,255,255,.2);font-size:11px;letter-spacing:.22em;z-index:10;transition:.25s}
.menu-btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 14px rgba(168,255,96,.3)}
.burger{display:flex;flex-direction:column;gap:4px}
.burger i{display:block;width:16px;height:1.5px;background:currentColor}

/* Hero */
.hero{position:absolute;left:5%;top:18%;width:min(560px,44%);z-index:5;pointer-events:none;transition:transform .6s ease-out}
.era-tag{font-size:10.5px;letter-spacing:.3em;color:var(--neon);opacity:.85;margin-bottom:14px}
.glitch{position:relative;font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,72px);line-height:1.02;letter-spacing:.04em}
.glitch span{display:block}
.g-main{position:relative;color:transparent;background:linear-gradient(180deg,#fff 10%,rgba(255,255,255,.1) 115%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1px rgba(255,255,255,.55)}
.g-r,.g-b,.g-gh,.g-gh2{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.g-r{color:rgba(255,40,80,.5);transform:translate(-3px,0);mix-blend-mode:screen;clip-path:inset(0 0 58% 0);animation:gl1 3.2s infinite steps(1)}
.g-b{color:rgba(40,200,255,.5);transform:translate(3px,0);mix-blend-mode:screen;clip-path:inset(52% 0 0 0);animation:gl2 2.7s infinite steps(1)}
.g-gh{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.13);transform:translateY(-40%)}
.g-gh2{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);transform:translateY(40%)}
@keyframes gl1{0%{clip-path:inset(0 0 58% 0)}30%{clip-path:inset(10% 0 70% 0);transform:translate(-5px,1px)}31%{clip-path:inset(0 0 58% 0);transform:translate(-3px,0)}70%{clip-path:inset(40% 0 30% 0)}72%{clip-path:inset(0 0 58% 0)}}
@keyframes gl2{0%{clip-path:inset(52% 0 0 0)}40%{clip-path:inset(70% 0 10% 0);transform:translate(6px,-1px)}42%{clip-path:inset(52% 0 0 0);transform:translate(3px,0)}80%{clip-path:inset(20% 0 60% 0)}82%{clip-path:inset(52% 0 0 0)}}
.hero-desc{margin-top:18px;max-width:340px;font-size:12px;line-height:1.75;color:var(--mute)}
.hero-desc.swap{animation:fadeUp .7s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Panel informasi */
.info{position:absolute;left:24px;bottom:72px;width:min(380px,38%);max-height:46%;overflow-y:auto;z-index:7;padding:18px 18px 16px;border-radius:16px;
  background:linear-gradient(160deg,rgba(24,32,36,.62),rgba(8,12,14,.5));border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);scrollbar-width:thin;scrollbar-color:rgba(168,255,96,.4) transparent}
.info::-webkit-scrollbar{width:4px}.info::-webkit-scrollbar-thumb{background:rgba(168,255,96,.4);border-radius:4px}
.info.swap{animation:slideFade .7s cubic-bezier(.2,.8,.2,1)}
@keyframes slideFade{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.sheet-handle{display:none}
.ip-head{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.2em;color:var(--neon);margin-bottom:8px}
.ip-chip{border:1px solid rgba(168,255,96,.45);padding:3px 8px;border-radius:20px;font-size:9px;color:#dfffc4}
.ip-inst{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:700;letter-spacing:.03em;line-height:1.35;margin-bottom:10px}
.ip-rows{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:11px;margin-bottom:12px}
.ip-rows dt{color:rgba(255,255,255,.45);letter-spacing:.1em}
.ip-rows dd{color:#e6ecee}
.ip-stats{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end;margin-bottom:12px;padding:10px 0;border-top:1px dashed rgba(255,255,255,.1);border-bottom:1px dashed rgba(255,255,255,.1)}
.ip-years{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--neon);text-shadow:0 0 12px rgba(168,255,96,.45);white-space:nowrap}
.ip-years i{font-style:normal;opacity:.6;margin:0 6px;font-size:14px}
.ip-years small{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.45);text-shadow:none;margin-top:3px}
.ip-xp{font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.ip-xp .xl{display:flex;justify-content:space-between;margin-bottom:6px}
.ip-xp b{color:var(--neon)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,#4f9a2a,var(--neon));box-shadow:0 0 10px var(--neon);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 1.8s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ip-desc{font-size:11px;line-height:1.7;color:var(--mute);margin-bottom:12px}
.ip-roles{list-style:none;margin-bottom:12px;font-size:11px}
.ip-roles li{padding:5px 0 5px 16px;position:relative;color:#e1e8ea;border-bottom:1px solid rgba(255,255,255,.05)}
.ip-roles li::before{content:'';position:absolute;left:2px;top:11px;width:6px;height:6px;background:var(--neon);box-shadow:0 0 8px var(--neon);transform:rotate(45deg)}
.ip-label{font-size:9px;letter-spacing:.25em;color:rgba(255,255,255,.4);margin-bottom:6px}
.ip-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ip-tags span{font-size:9.5px;padding:4px 9px;border-radius:20px;background:rgba(168,255,96,.08);border:1px solid rgba(168,255,96,.3);color:#d8ffbd;letter-spacing:.04em}
.ip-tl{position:relative;height:40px;margin:6px 10px 2px}
.tl-line{position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(255,255,255,.12)}
.tl-line i{position:absolute;left:0;top:0;bottom:0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width 1s ease}
.tl-node{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.tl-node b{width:14px;height:14px;border-radius:50%;background:#0b1013;border:2px solid rgba(255,255,255,.3)}
.tl-node.on b{border-color:var(--neon)}
.tl-node.cur b{background:var(--neon);box-shadow:0 0 12px var(--neon)}
.tl-node span{font-size:8.5px;letter-spacing:.12em;color:rgba(255,255,255,.55);text-align:center;white-space:nowrap}
.tl-node.cur span{color:var(--neon)}
.tl-node em{display:block;font-style:normal;opacity:.6}
.ip-help{font-size:10.5px;line-height:1.9;color:var(--mute)}
.ip-help kbd{font-family:'Space Mono',monospace;font-size:9.5px;padding:1px 6px;border:1px solid rgba(255,255,255,.25);border-radius:4px;color:#fff;margin-right:4px}

/* Kartu panel kanan (carousel) */
.stack{position:absolute;right:5%;top:50%;width:clamp(180px,16.5vw,250px);aspect-ratio:.62;margin-top:calc(clamp(180px,16.5vw,250px) / -.62 / 2);perspective:1100px;z-index:8}
.card{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer;
  transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .4s;filter:drop-shadow(0 0 10px rgba(168,255,96,.35))}
.card[data-pos="0"]{z-index:3;transform:translate3d(0,0,0) rotateY(var(--ry,-6deg)) rotateX(var(--rx,0deg))}
.card[data-pos="1"]{z-index:2;opacity:.8;transform:translate3d(34%,0,-130px) rotateY(-26deg) scale(.94);filter:drop-shadow(0 0 6px rgba(168,255,96,.2)) brightness(.7)}
.card[data-pos="2"]{z-index:1;opacity:.5;transform:translate3d(58%,0,-260px) rotateY(-34deg) scale(.88);filter:drop-shadow(0 0 4px rgba(168,255,96,.15)) brightness(.5)}
.card[data-pos="0"]:hover,.card.hot{filter:drop-shadow(0 0 22px rgba(168,255,96,.75))}
.card[data-pos="1"]:hover,.card[data-pos="2"]:hover{filter:drop-shadow(0 0 14px rgba(168,255,96,.5)) brightness(.95)}
.c-border{position:absolute;inset:0;background:linear-gradient(160deg,#c6ff94,var(--neon) 30%,#5fae32 60%,var(--neon));clip-path:var(--chamfer)}
.c-inner{position:absolute;inset:2px;background:#0a0f12;clip-path:var(--chamfer);overflow:hidden}
.c-media{position:absolute;inset:0}
.c-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.c-media img.ok{opacity:1}
.c-media canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 60%,rgba(5,8,10,.9));pointer-events:none}
.c-scan{position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(180deg,transparent,rgba(168,255,96,.18),transparent);z-index:2;pointer-events:none;animation:cscan 3.5s linear infinite}
@keyframes cscan{to{top:110%}}
.c-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.c-badge{font-size:9px;letter-spacing:.12em;padding:4px 8px;background:rgba(0,0,0,.55);border:1px solid rgba(168,255,96,.45);color:#e5ffd2;clip-path:var(--chamfer-s)}
.c-dots{display:flex;gap:5px}
.c-dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--neon)}
.c-dots i.on{background:var(--neon);box-shadow:0 0 8px var(--neon);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.c-num{position:absolute;left:12px;bottom:66px;z-index:3;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;color:transparent;-webkit-text-stroke:1px rgba(168,255,96,.75)}
.c-name{position:absolute;left:12px;bottom:56px;z-index:3;font-size:8.5px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
.c-btn{position:absolute;left:10px;right:10px;bottom:10px;height:38px;z-index:4;background:var(--neon);color:#09120a;font-weight:700;font-size:10.5px;letter-spacing:.2em;clip-path:var(--chamfer-s);transition:.25s}
.c-btn span{position:absolute;inset:3px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.45);clip-path:var(--chamfer-s)}
.c-btn:hover{background:#c9ff9a;box-shadow:0 0 20px var(--neon)}
.card[data-pos="1"] .c-btn,.card[data-pos="2"] .c-btn{opacity:.6}

/* Pagination */
.pager{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:30px;z-index:7}
#frame:not(.ui-in) .pager{transform:translate(-50%,20px)}
.pager button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.15em;transition:.3s}
.pager button:hover{color:#fff}
.pager .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transition:.35s}
.pager .lbl{font-size:8.5px;letter-spacing:.2em;opacity:.65}
.pager button.active{color:var(--neon)}
.pager button.active .dot{width:10px;height:10px;background:var(--neon);box-shadow:0 0 12px var(--neon)}

/* Kontrol audio */
.audio-ctrl{position:absolute;left:24px;bottom:20px;display:flex;align-items:center;gap:10px;z-index:9}
.mute-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(22,28,32,.6);border:1px solid rgba(255,255,255,.2);transition:.25s}
.mute-btn:hover{border-color:var(--neon);color:var(--neon)}
.mute-btn svg{width:17px;height:17px}
.mute-btn .x{display:none}
.audio-ctrl.muted .mute-btn .x{display:block}
.audio-ctrl.muted .mute-btn .wave{display:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px}
.eq i{width:3px;height:100%;background:var(--neon);transform-origin:bottom;box-shadow:0 0 6px rgba(168,255,96,.6);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:.8s}
.eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.2s}
.eq i:nth-child(4){animation-delay:-.15s;animation-duration:.7s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.audio-ctrl.muted .eq i{animation:none;transform:scaleY(.15);opacity:.4}
.vol{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--neon) var(--v,70%),rgba(255,255,255,.18) var(--v,70%));cursor:pointer}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.vol::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--neon)}

/* ============================================================================
   AUDIO ENGINE — WEB AUDIO API (MURNI DISINTESIS TANPA FILE EKSTERNAL)
   ============================================================================ */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.noiseBuffer = null;
    this.muted = false;
    this.volume = 0.7;
    this.started = false;
    this.lastTickTime = 0;
  }

  // Inisialisasi AudioContext setelah klik pertama pengguna
  init() {
    if (this.started) {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.volume;
    this.master.connect(this.ctx.destination);

    // Buat buffer white noise untuk berbagai efek (hum, whoosh, glitch)
    const sr = this.ctx.sampleRate;
    const len = sr * 3;
    this.noiseBuffer = this.ctx.createBuffer(1, len, sr);
    const data = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    this._startAmbientDrone();
    this._startStageHum();
    this.started = true;
  }

  // Ambient drone: 2 oscillator sawtooth/sine rendah (55Hz & 110Hz) + low-pass filter + LFO
  _startAmbientDrone() {
    const now = this.ctx.currentTime;
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(55, now);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(110, now);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(170, now);
    filter.Q.setValueAtTime(2.2, now);

    // LFO pelan untuk memodulasi cutoff filter
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(0.14, now);
    lfoGain.gain.setValueAtTime(65, now);
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);

    const droneGain = this.ctx.createGain();
    droneGain.gain.setValueAtTime(0.001, now);
    droneGain.gain.exponentialRampToValueAtTime(0.055, now + 1.8);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(this.master);

    osc1.start(now);
    osc2.start(now);
    lfo.start(now);
  }

  // Hum lantai panggung: noise lembut terfilter bandpass
  _startStageHum() {
    const now = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    src.loop = true;

    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(135, now);
    bp.Q.setValueAtTime(4.0, now);

    const humGain = this.ctx.createGain();
    humGain.gain.setValueAtTime(0.025, now);

    src.connect(bp);
    bp.connect(humGain);
    humGain.connect(this.master);
    src.start(now);
  }

  // UI hover: blip pendek tinggi (sine 1200Hz, 40ms)
  playHover() {
    if (!this.started || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(1420, now + 0.04);
    g.gain.setValueAtTime(0.055, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.042);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + 0.045);
  }

  // UI klik: click-tick + chirp naik (square 400→900Hz, 90ms)
  playClick() {
    if (!this.started || this.muted) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.09);
    g.gain.setValueAtTime(0.07, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.092);

    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, now);

    osc.connect(lp);
    lp.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + 0.095);
  }

  // Teks scramble: tick kecil per huruf
  playTick() {
    if (!this.started || this.muted) return;
    const now = this.ctx.currentTime;
    if (now - this.lastTickTime < 0.032) return;
    this.lastTickTime = now;

    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1550 + Math.random() * 350, now);
    g.gain.setValueAtTime(0.024, now);
    g.gain.exponentialRampToValueAtTime(0.0005, now + 0.018);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + 0.02);
  }

  // Glitch random: burst noise pendek 30–80ms
  playGlitch() {
    if (!this.started || this.muted) return;
    const now = this.ctx.currentTime;
    const dur = 0.03 + Math.random() * 0.05;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;

    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(900 + Math.random() * 2200, now);
    bp.Q.setValueAtTime(2.5, now);

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.075, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    src.connect(bp);
    bp.connect(g);
    g.connect(this.master);
    src.start(now, Math.random() * 2, dur);
  }

  // Ganti outfit: whoosh (200→4000Hz 0.8s) + scan beep naik nada + impact bass (80→40Hz) + nada khas jenjang
  playMorph(eraIndex) {
    if (!this.started || this.muted) return;
    const now = this.ctx.currentTime;

    // 1. Whoosh (white noise + bandpass sweep 200→4000Hz selama 0.8s)
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.setValueAtTime(2.2, now);
    bp.frequency.setValueAtTime(200, now);
    bp.frequency.exponentialRampToValueAtTime(4000, now + 0.8);

    const wg = this.ctx.createGain();
    wg.gain.setValueAtTime(0.001, now);
    wg.gain.linearRampToValueAtTime(0.18, now + 0.25);
    wg.gain.exponentialRampToValueAtTime(0.001, now + 0.82);

    noise.connect(bp);
    bp.connect(wg);
    wg.connect(this.master);
    noise.start(now, 0, 0.85);

    // 2. Scan beep naik nada
    const scanOsc = this.ctx.createOscillator();
    const sg = this.ctx.createGain();
    scanOsc.type = 'sine';
    scanOsc.frequency.setValueAtTime(320, now);
    scanOsc.frequency.exponentialRampToValueAtTime(1480, now + 0.72);
    sg.gain.setValueAtTime(0.001, now);
    sg.gain.linearRampToValueAtTime(0.06, now + 0.12);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 0.74);
    scanOsc.connect(sg);
    sg.connect(this.master);
    scanOsc.start(now);
    scanOsc.stop(now + 0.76);

    // 3. Impact bass (sine 80→40Hz) saat outfit materialize
    const bass = this.ctx.createOscillator();
    const bg = this.ctx.createGain();
    const tImpact = now + 0.34;
    bass.type = 'sine';
    bass.frequency.setValueAtTime(80, tImpact);
    bass.frequency.exponentialRampToValueAtTime(40, tImpact + 0.45);
    bg.gain.setValueAtTime(0.24, tImpact);
    bg.gain.exponentialRampToValueAtTime(0.001, tImpact + 0.48);
    bass.connect(bg);
    bg.connect(this.master);
    bass.start(tImpact);
    bass.stop(tImpact + 0.5);

    // 4. Nada khas tiap jenjang
    this._playEraSignature(eraIndex, now + 0.28);
  }

  _playEraSignature(eraIndex, startTime) {
    const era = CONFIG.eras[eraIndex];
    if (!era) return;
    const notes = era.chord;

    if (era.chordStyle === 'arpeggio-bright') {
      // SMP: Arpeggio ceria C - E - G
      notes.forEach((freq, i) => {
        const t = startTime + i * 0.095;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq * 2, t);
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.36);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.38);
      });
    } else if (era.chordStyle === 'arpeggio-bold') {
      // SMK: Arpeggio mantap D - F# - A
      notes.forEach((freq, i) => {
        const t = startTime + i * 0.105;
        const osc = this.ctx.createOscillator();
        const lp = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(1600, t);
        g.gain.setValueAtTime(0.08, t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.42);
        osc.connect(lp);
        lp.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.44);
      });
    } else {
      // KULIAH: Chord megah E - G# - B - E tinggi
      notes.forEach((freq, i) => {
        const t = startTime + i * 0.03;
        const osc = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const lp = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc2.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        osc2.frequency.setValueAtTime(freq * 1.003, t);
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(2100, t);
        lp.frequency.exponentialRampToValueAtTime(700, t + 0.9);
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.95);
        osc.connect(lp);
        osc2.connect(lp);
        lp.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc2.start(t);
        osc.stop(t + 0.98);
        osc2.stop(t + 0.98);
      });
    }
  }

  setMuted(m) {
    this.muted = m;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.04);
    }
  }

  setVolume(v) {
    this.volume = Math.max(0, Math.min(1, v));
    if (this.master && this.ctx && !this.muted) {
      this.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.04);
    }
  }
}

   PEMBANTU DISPOSE & TEKSTUR PROSEDURAL (CANVAS 2D)
   ============================================================================ */
const disposableTracker = [];

function trackDisposable(resource) {
  if (resource) disposableTracker.push(resource);
  return resource;
}

function disposeObject3D(root) {
  if (!root) return;
  root.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach((m) => {
        if (m.map) m.map.dispose();
        if (m.emissiveMap) m.emissiveMap.dispose();
        m.dispose();
      });
    }
  });
}

    ctx.fill();
    ctx.fillStyle = '#94a3b8';

    // Emblem dada Universitas Malikussaleh

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(64, 80, 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.arc(64, 80, 42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('UNIMAL', 64, 87);
  } else if (type === 'id-unimal') {
    // ID Card gelap elegan seperti Gambar 1
    ctx.fillStyle = '#1e2226';
    ctx.fillRect(0, 0, 128, 160);
    ctx.strokeStyle = '#3f464d';
    ctx.lineWidth = 8;
    ctx.strokeRect(6, 6, 116, 148);
    ctx.fillStyle = '#166534';
    ctx.fillRect(16, 16, 96, 26);
    ctx.fillStyle = '#a8ff60';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('UNIMAL · TI', 64, 34);
    ctx.fillStyle = '#2d3339';
    ctx.fillRect(26, 54, 76, 64);
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(26, 128, 76, 8);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;

}

// Buat tekstur grain SVG untuk overlay halaman
function initGrainBackground() {
  const c = document.createElement('canvas');
  c.width = 140;
  c.height = 140;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(140, 140);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v;
    img.data[i + 1] = v;
    img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const grainEl = document.getElementById('grain');
  if (grainEl) {
    grainEl.style.backgroundImage = `url(${c.toDataURL()})`;
  }
}

// Helper pembuat segmen tungkai dengan ujung membulat (pengganti CapsuleGeometry di r128)
function createRoundedLimb(rTop, rBot, length, mat, radialSegs = 18) {
  const grp = new THREE.Group();
  const cylGeo = trackDisposable(new THREE.CylinderGeometry(rTop, rBot, length, radialSegs, 1));
  const cyl = new THREE.Mesh(cylGeo, mat);
  cyl.castShadow = true;
  cyl.receiveShadow = true;
  grp.add(cyl);

  const topGeo = trackDisposable(new THREE.SphereGeometry(rTop, radialSegs, 12));
  const topSph = new THREE.Mesh(topGeo, mat);
  topSph.position.y = length / 2;
  topSph.scale.y = 0.65;
  topSph.castShadow = true;
  grp.add(topSph);

  const botGeo = trackDisposable(new THREE.SphereGeometry(rBot, radialSegs, 12));
  const botSph = new THREE.Mesh(botGeo, mat);
  botSph.position.y = -length / 2;
  botSph.scale.y = 0.65;
  botSph.castShadow = true;
  grp.add(botSph);

  return grp;
}

// Helper menghubungkan dua titik 3D dengan silinder berujung bulat (untuk lengan & kaki berpose)
function createSegmentBetween(p1, p2, r1, r2, mat, radialSegs = 18) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  const limb = createRoundedLimb(r1, r2, len, mat, radialSegs);
  limb.position.copy(mid);
  limb.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return limb;
}

    [0.145, 0.115, 0.135, 0.36, 0.28, 0.42, 0.35, -0.48, -0.68],

    [-0.195, 0.06, 0.02, 0.32, 0.46, 0.52, 0, 0.15, 0.25],
    [0.195, 0.06, 0.02, 0.32, 0.46, 0.52, 0, -0.15, -0.25],
    [-0.18, 0.12, -0.06, 0.42, 0.42, 0.52, -0.2, 0.2, 0.3],
    [0.18, 0.12, -0.06, 0.42, 0.42, 0.52, -0.2, -0.2, -0.3]
  ];

  const baseSphereGeo = trackDisposable(new THREE.SphereGeometry(0.24, 20, 16));
  hairPuffs.forEach((p) => {
    const m = new THREE.Mesh(baseSphereGeo, hairMat);
    m.position.set(p[0], p[1], p[2]);
    m.scale.set(p[3], p[4], p[5]);
    m.rotation.set(p[6], p[7], p[8]);
    m.castShadow = true;
    m.receiveShadow = true;
    hairGroup.add(m);
  });

  // =========================================================
  // TANGAN DI SAKU (PUNGGUNG TANGAN KULIT SAWO MATANG)
  // =========================================================
  [-1, 1].forEach((side) => {
    const handGeo = trackDisposable(new THREE.SphereGeometry(0.062, 14, 12));
    const hand = new THREE.Mesh(handGeo, skinMat);
    hand.position.set(side * 0.225, 1.72, 0.125);
    hand.scale.set(0.75, 0.95, 0.65);
    hand.rotation.z = side * 0.35;
    hand.castShadow = true;
    root.add(hand);
  });

  // =========================================================
  // PEMBUATAN TIGA OUTFIT TERPISAH
  // =========================================================
  const outfitSMP = buildOutfitSMP(skinMat);
  const outfitSMK = buildOutfitSMK(skinMat);
  const outfitKuliah = buildOutfitKuliah(skinMat);

  const outfits = [outfitSMP, outfitSMK, outfitKuliah];
  outfits.forEach((grp, idx) => {
    prepareOutfitMaterials(grp);
    grp.visible = idx === 0;
    root.add(grp);
  });

  // Sedikit condong santai seperti referensi Gambar 1
  root.rotation.z = -0.012;

  return {
    root,
    upperBodyPivot,
    headGroup,
    brows,
    outfits
  };
}

// Siapkan material tiap outfit agar mendukung transparansi & emissive saat scan-line morph
function prepareOutfitMaterials(outfitGroup) {
  const materials = [];
  outfitGroup.traverse((obj) => {
    if (obj.isMesh && obj.material) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      const cloned = obj.material.clone();
      cloned.transparent = true;
      cloned.opacity = 1;
      cloned.userData.baseEmissive = cloned.emissive ? cloned.emissive.clone() : new THREE.Color(0x000000);
      cloned.userData.baseEmissiveIntensity = cloned.emissiveIntensity || 0;
      obj.material = trackDisposable(cloned);
      materials.push(cloned);
    }
  });
  outfitGroup.userData.materials = materials;
}

/* ============================================================================
   PANGGUNG, LINGKUNGAN FUTURISTIK, PENCAHAYAAN & SCAN-LINE MORPH RING
   ============================================================================ */
function buildStageAndEnvironment(scene) {
  const envGroup = new THREE.Group();
  scene.add(envGroup);

  // Lantai dasar gelap luas
  const floorMat = trackDisposable(new THREE.MeshStandardMaterial({
    color: 0x06090c,
    roughness: 0.28,
    metalness: 0.65
  }));
  const floorGeo = trackDisposable(new THREE.PlaneGeometry(42, 42));
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.12;
  floor.receiveShadow = true;
  envGroup.add(floor);

  // Panggung bundar hitam-glossy
  const stageMat = trackDisposable(new THREE.MeshStandardMaterial({
    color: 0x0b1014,
    roughness: 0.20,
    metalness: 0.72
  }));
  const stageGeo = trackDisposable(new THREE.CylinderGeometry(2.85, 3.05, 0.12, 64));
  const stage = new THREE.Mesh(stageGeo, stageMat);
  stage.position.y = -0.06;
  stage.receiveShadow = true;
  envGroup.add(stage);

  // Ring cahaya putih-kebiruan (emissive) di lantai panggung (seperti Gambar 2)
  const ringMat1 = trackDisposable(new THREE.MeshBasicMaterial({
    color: 0xdff7ff
  }));
  const ringGeo1 = trackDisposable(new THREE.TorusGeometry(2.68, 0.028, 12, 96));
  const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
  ring1.rotation.x = Math.PI / 2;
  ring1.position.y = 0.005;
  envGroup.add(ring1);

  const ringMat2 = trackDisposable(new THREE.MeshBasicMaterial({
    color: 0x8ae6ff,
    transparent: true,
    opacity: 0.65
  }));
  const ringGeo2 = trackDisposable(new THREE.TorusGeometry(2.84, 0.016, 10, 96));
  const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
  ring2.rotation.x = Math.PI / 2;
  ring2.position.y = 0.002;
  envGroup.add(ring2);

  // Kolom-kolom / pilar siluet gelap di belakang dengan light streak vertikal
  const pillarMat = trackDisposable(new THREE.MeshStandardMaterial({
    color: 0x090d11,
    roughness: 0.45,
    metalness: 0.55
  }));
  const streakCyanMat = trackDisposable(new THREE.MeshBasicMaterial({
    color: 0xbef3ff,
    transparent: true,
    opacity: 0.75
  }));
  const streakNeonMat = trackDisposable(new THREE.MeshBasicMaterial({
    color: CONFIG.colors.neon,
    transparent: true,
    opacity: 0.55
  }));

  const pillarConfigs = [
    { x: -3.2, z: -4.2, w: 0.55, h: 8.5 },
    { x: -1.7, z: -5.2, w: 0.65, h: 9.5 },
    { x: -0.4, z: -5.6, w: 0.48, h: 9.5 },
    { x: 1.4,  z: -5.0, w: 0.62, h: 9.5 },
    { x: 2.9,  z: -4.0, w: 0.55, h: 8.5 },
    { x: 4.3,  z: -3.0, w: 0.60, h: 8.0 }
  ];

  pillarConfigs.forEach((p, idx) => {
    const pGeo = trackDisposable(new THREE.CylinderGeometry(p.w * 0.5, p.w * 0.5, p.h, 20));
    const mesh = new THREE.Mesh(pGeo, pillarMat);
    mesh.position.set(p.x, p.h * 0.42, p.z);
    envGroup.add(mesh);

    // Light streak vertikal pada kolom
    const sGeo = trackDisposable(new THREE.BoxGeometry(0.032, p.h * 0.75, 0.032));
    const sMesh = new THREE.Mesh(sGeo, idx % 2 === 0 ? streakCyanMat : streakNeonMat);
    sMesh.position.set(p.x + (p.x < 0 ? 0.22 : -0.22), p.h * 0.42, p.z + 0.22);
    envGroup.add(sMesh);
  });

  // Elemen tangga cahaya bertingkat di kiri belakang (meniru estetika Gambar 2)
  const stepLightMat = trackDisposable(new THREE.MeshBasicMaterial({
    color: 0xdff6ff,
    transparent: true,
    opacity: 0.85
  }));
  for (let i = 0; i < 6; i++) {
    const stepGeo = trackDisposable(new THREE.BoxGeometry(2.3, 0.06, 0.22));
    const step = new THREE.Mesh(stepGeo, stepLightMat);
    step.position.set(-3.4 - i * 0.15, 0.38 + i * 0.22, -2.5 - i * 0.35);
    step.rotation.y = 0.28;
    envGroup.add(step);
  }

  // Partikel debu melayang
  const particleCount = 240;
  const pGeo = trackDisposable(new THREE.BufferGeometry());
  const posArr = new Float32Array(particleCount * 3);
  const speedArr = new Float32Array(particleCount);
  for (let i = 0; i < particleCount; i++) {
    posArr[i * 3] = (Math.random() - 0.5) * 9.5;
    posArr[i * 3 + 1] = Math.random() * 5.2;
    posArr[i * 3 + 2] = (Math.random() - 0.5) * 7.5;
    speedArr[i] = 0.08 + Math.random() * 0.18;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  const pMat = trackDisposable(new THREE.PointsMaterial({
    color: 0xc8ff9e,
    size: 0.032,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  const particles = new THREE.Points(pGeo, pMat);
  scene.add(particles);

  // Scan-line Morph Ring (menyapu dari kaki ke kepala saat ganti outfit)
  const scanGroup = new THREE.Group();
  scanGroup.visible = false;
  const scanTorusGeo = trackDisposable(new THREE.TorusGeometry(0.68, 0.022, 12, 48));
  const scanTorusMat = trackDisposable(new THREE.MeshBasicMaterial({
    color: CONFIG.colors.neon
  }));
  const scanTorus = new THREE.Mesh(scanTorusGeo, scanTorusMat);
  scanTorus.rotation.x = Math.PI / 2;
  scanGroup.add(scanTorus);

  const scanDiscGeo = trackDisposable(new THREE.CircleGeometry(0.68, 40));
  const scanDiscMat = trackDisposable(new THREE.MeshBasicMaterial({
    color: CONFIG.colors.neon,
    transparent: true,
    opacity: 0.26,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  }));
  const scanDisc = new THREE.Mesh(scanDiscGeo, scanDiscMat);
  scanDisc.rotation.x = Math.PI / 2;
  scanGroup.add(scanDisc);

  const scanLight = new THREE.PointLight(CONFIG.colors.neon, 0, 2.6);
  scanGroup.add(scanLight);
  scene.add(scanGroup);

  // =========================================================
  // PENCAHAYAAN (KEY HANGAT, RIM HIJAU NEON, FILL BIRU KEHIJAUAN)
  // =========================================================
  const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x091318, 0.55);
  scene.add(hemiLight);

  // Key light hangat dengan shadow aktif
  const keyLight = new THREE.DirectionalLight(0xfff1dc, 1.35);
  keyLight.position.set(2.4, 4.8, 3.6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.near = 1.0;
  keyLight.shadow.camera.far = 12.0;
  const d = 2.4;
  keyLight.shadow.camera.left = -d;
  keyLight.shadow.camera.right = d;
  keyLight.shadow.camera.top = d;
  keyLight.shadow.camera.bottom = -d;
  keyLight.shadow.bias = -0.0008;
  scene.add(keyLight);

  // Rim light hijau neon (#a8ff60) dari belakang kanan
  const rimLight = new THREE.DirectionalLight(CONFIG.colors.neon, 1.45);
  rimLight.position.set(2.8, 3.4, -3.2);
  scene.add(rimLight);

  // Fill light biru kehijauan dari kiri
  const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.85);
  fillLight.position.set(-3.2, 2.4, 2.0);
  scene.add(fillLight);

  // Cahaya pantulan lantai panggung
  const floorBounce = new THREE.PointLight(0x9be8ff, 0.65, 5.0);
  floorBounce.position.set(0, 0.25, 0.8);
  scene.add(floorBounce);

  return {
    envGroup,
    particles,
    particleSpeeds: speedArr,
    scanGroup,
    scanLight
  };
}

    const card = document.createElement('div');

    card.innerHTML = `
      <div class="c-border"></div>
      <div class="c-inner">
        <div class="c-media"><canvas width="220" height="350"></canvas></div>

    card.addEventListener('mousemove', (e) => {

// Render preview karakter untuk masing-masing outfit ke canvas di dalam kartu kanan
function renderAllCardSnapshots() {
  const prevVis = character.outfits.map((o) => o.visible);
  const prevYaw = character.root.rotation.y;

  CONFIG.eras.forEach((_, idx) => {
    character.outfits.forEach((o, i) => { o.visible = i === idx; });
    character.root.rotation.y = -0.22;
    miniRenderer.render(scene, miniCamera);
    const dest = cardCanvases[idx];
    if (dest) {
      const ctx = dest.getContext('2d');
      ctx.clearRect(0, 0, dest.width, dest.height);
      ctx.drawImage(miniRenderer.domElement, 0, 0, dest.width, dest.height);
    }
  });

  character.outfits.forEach((o, i) => { o.visible = prevVis[i]; });
  character.root.rotation.y = prevYaw;
}

// Efek decode / scramble huruf pada judul hero
let scrambleRaf = null;
function scrambleHeroTitle(targetText) {
  const titleEl = document.getElementById('title');
  if (!titleEl) return;
  const spans = titleEl.querySelectorAll('span');
  const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#*+=';
  const duration = 560;
  const start = performance.now();

  if (scrambleRaf) cancelAnimationFrame(scrambleRaf);

  function step(now) {
    const p = Math.min(1, (now - start) / duration);
    const revealCount = Math.floor(p * targetText.length);
    let out = '';
    for (let i = 0; i < targetText.length; i++) {
      if (targetText[i] === ' ') {
        out += ' ';
      } else if (i < revealCount || p >= 1) {
        out += targetText[i];
      } else {
        out += glyphs[Math.floor(Math.random() * glyphs.length)];
      }
    }
    spans.forEach((s) => { s.textContent = out; });
    if (p < 1) {
      audio.playTick();
      scrambleRaf = requestAnimationFrame(step);
    }
  }
  scrambleRaf = requestAnimationFrame(step);
}

// Count-up angka tahun pada panel informasi
let yearCountRaf = null;
function animateYearCounter(startYear, endYear, suffix = '') {
  const el = document.getElementById('yearCounter');
  if (!el) return;
  if (yearCountRaf) cancelAnimationFrame(yearCountRaf);

  const fromA = startYear - 18;
  const fromB = endYear - 18;
  const dur = 750;
  const t0 = performance.now();

  function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    const ease = 1 - Math.pow(1 - p, 3);
    const curA = Math.round(fromA + (startYear - fromA) * ease);
    const curB = Math.round(fromB + (endYear - fromB) * ease);
    el.innerHTML = `${curA}<i>→</i>${curB}<small>PERIODE PENDIDIKAN${suffix}</small>`;
    if (p < 1) yearCountRaf = requestAnimationFrame(tick);
  }
  yearCountRaf = requestAnimationFrame(tick);
}

// Render isi panel informasi pendidikan di kiri bawah
function renderInfoPanel(eraIdx) {
  const era = CONFIG.eras[eraIdx];
  if (!era || !infoEl) return;

  const progressWidth = eraIdx === 0 ? '15%' : eraIdx === 1 ? '55%' : '100%';
  const timelineHTML = `
    <div class="ip-label">TIMELINE PERJALANAN</div>
    <div class="ip-tl">
      <div class="tl-line"><i style="width:${progressWidth}"></i></div>
      <div class="tl-node ${eraIdx >= 0 ? 'on' : ''} ${eraIdx === 0 ? 'cur' : ''}" style="left:12%">
        <b></b><span>SMP<em>2018–2020</em></span>
      </div>
      <div class="tl-node ${eraIdx >= 1 ? 'on' : ''} ${eraIdx === 1 ? 'cur' : ''}" style="left:52%">
        <b></b><span>SMK<em>2019–2022</em></span>
      </div>
      <div class="tl-node ${eraIdx >= 2 ? 'on' : ''} ${eraIdx === 2 ? 'cur' : ''}" style="left:90%">
        <b></b><span>KULIAH<em>UNIMAL</em></span>
      </div>
    </div>
  `;

  let detailRows = `<dt>INSTITUSI</dt><dd>${era.institusi}</dd>`;
  detailRows += `<dt>PERIODE</dt><dd>${era.periode}</dd>`;
  if (era.jurusan) detailRows += `<dt>JURUSAN</dt><dd>${era.jurusan}</dd>`;
  if (era.peran) detailRows += `<dt>PERAN</dt><dd>${era.peran}</dd>`;

  const rolesHTML = era.roles && era.roles.length
    ? `<div class="ip-label">PERAN ORGANISASI</div>
       <ul class="ip-roles">${era.roles.map((r) => `<li>${r}</li>`).join('')}</ul>`
    : '';

  const tagsHTML = `<div class="ip-tags">${era.tags.map((t) => `<span>${t}</span>`).join('')}</div>`;

  let bodyContent = '';
  if (state.infoTab === '4') {
    // Tab Info / Bantuan Interaksi
    bodyContent = `
      <div class="ip-help">
        <div><kbd>DRAG</kbd> Putar karakter 360° di atas panggung</div>
        <div><kbd>KLIK KARTU</kbd> Ganti outfit &amp; jenjang pendidikan</div>
        <div><kbd>←</kbd> <kbd>→</kbd> Navigasi jenjang via keyboard</div>
        <div><kbd>M</kbd> Mute / Unmute synthesizer Web Audio</div>
      </div>
      ${timelineHTML}
    `;
  } else if (state.infoTab === '3') {
    // Tab Pencapaian & Organisasi
    bodyContent = `
      <dl class="ip-rows">${detailRows}</dl>
      ${rolesHTML || `<p class="ip-desc">${era.deskripsi}</p>`}
      ${tagsHTML}
      ${timelineHTML}
    `;
  } else if (state.infoTab === '2') {
    // Tab Dokumen / Deskripsi Lengkap
    bodyContent = `
      <dl class="ip-rows">${detailRows}</dl>
      <p class="ip-desc">${era.deskripsi}</p>
      ${rolesHTML}
      ${tagsHTML}
    `;
  } else {
    // Tab Default (Home: lengkap)
    bodyContent = `
      <dl class="ip-rows">${detailRows}</dl>
      <p class="ip-desc">${era.deskripsi}</p>
      ${rolesHTML}
      ${tagsHTML}
      ${timelineHTML}
    `;
  }

  infoEl.classList.remove('swap');
  void infoEl.offsetWidth;
  infoEl.classList.add('swap');

  infoEl.innerHTML = `
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="ip-head">
      <span>// DATA PENDIDIKAN · ${era.num}</span>
      <span class="ip-chip">${era.outfitLabel}</span>
    </div>
    <h2 class="ip-inst">${era.institusi}</h2>
    <div class="ip-stats">
      <div class="ip-years" id="yearCounter">${era.yearStart}<i>→</i>${era.yearEnd}<small>PERIODE PENDIDIKAN${era.yearSuffix}</small></div>
      <div class="ip-xp">
        <div class="xl"><span>${era.xpLabel}</span><b>${era.xp}%</b></div>
        <div class="bar"><i id="xpBarFill"></i></div>
      </div>
    </div>
    ${bodyContent}
  `;

  // Animasi progress bar pengalaman & counter tahun
  requestAnimationFrame(() => {
    const barFill = document.getElementById('xpBarFill');
    if (barFill) barFill.style.width = `${era.xp}%`;
  });
  animateYearCounter(era.yearStart, era.yearEnd, era.yearSuffix);

  // Klik sheet-handle di mobile untuk buka/tutup bottom sheet
  const sh = document.getElementById('sheetHandle');
  if (sh) {
    sh.addEventListener('click', () => {
      infoEl.classList.toggle('expanded');
    });
  }
}

// Perbarui seluruh komponen UI saat jenjang berubah
function updateUIForEra(eraIdx, withSound = true) {
  const era = CONFIG.eras[eraIdx];
  if (!era) return;

  // Tag & judul hero
  const eraTag = document.getElementById('eraTag');
  if (eraTag) eraTag.textContent = `// EDUCATION JOURNEY · ${era.num} / 03 · ${era.short}`;
  scrambleHeroTitle(era.heroTitle);

  const heroDesc = document.getElementById('heroDesc');
  if (heroDesc) {
    heroDesc.classList.remove('swap');
    void heroDesc.offsetWidth;
    heroDesc.textContent = era.heroDesc;
    heroDesc.classList.add('swap');
  }

  // Susun posisi kartu carousel (0 = depan, 1 = tengah, 2 = belakang)
  const cards = stackEl.querySelectorAll('.card');
  cards.forEach((c, idx) => {
    const pos = (idx - eraIdx + CONFIG.eras.length) % CONFIG.eras.length;
    c.dataset.pos = String(pos);
  });

  // Indikator pagination bawah
  const pagerBtns = pagerEl.querySelectorAll('button');
  pagerBtns.forEach((b, idx) => {
    b.classList.toggle('active', idx === eraIdx);
  });

  // Item menu
  const menuBtns = menuItemsEl.querySelectorAll('.menu-item');
  menuBtns.forEach((b, idx) => {
    b.classList.toggle('active', idx === eraIdx);
  });

  // Panel info kiri bawah
  renderInfoPanel(eraIdx);

  if (withSound) {
    audio.playMorph(eraIdx);
  }
}

// Pilih jenjang pendidikan & jalankan transisi "Scan-Line Morph"
function selectEra(targetIdx) {
  if (targetIdx < 0 || targetIdx >= CONFIG.eras.length) return;
  const prevIdx = state.currentEra;
  state.currentEra = targetIdx;

  // Mulai animasi scan-line morph
  state.morph.active = true;
  state.morph.startTime = performance.now();
  state.morph.fromIdx = prevIdx;
  state.morph.toIdx = targetIdx;

  // Tampilkan kedua outfit selama morph
  character.outfits.forEach((grp, idx) => {
    grp.visible = idx === prevIdx || idx === targetIdx;
    grp.position.set(0, 0, 0);
    grp.scale.set(1, idx === targetIdx && prevIdx !== targetIdx ? 0.06 : 1, 1);
  });

  // Flash layar
  const flashEl = document.getElementById('flash');
  if (flashEl) {
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
  }

  // Beri sedikit dorongan putaran saat berganti outfit
  state.targetCharYaw += 0.42;

  updateUIForEra(targetIdx, true);
}

/* ============================================================================
   TOAST, NAVIGASI ATAS, MENU OVERLAY, AUDIO CONTROLS, GLITCH RANDOM
   ============================================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2100);
}

// Navigasi pill 5 ikon di tengah atas
document.querySelectorAll('#nav button').forEach((btn) => {
  btn.addEventListener('mouseenter', () => audio.playHover());
  btn.addEventListener('click', () => {
    markInteraction();
    audio.playClick();
    const act = btn.dataset.act;
    if (act === 'cam') {
      state.camPresetIndex = (state.camPresetIndex + 1) % CAMERA_PRESETS.length;
      showToast(`CAMERA: ${CAMERA_PRESETS[state.camPresetIndex].name}`);
      return;
    }
    document.querySelectorAll('#nav button').forEach((b) => {
      if (b.dataset.act !== 'cam') b.classList.remove('active');
    });
    btn.classList.add('active');
    state.infoTab = act;
    renderInfoPanel(state.currentEra);
    if (window.innerWidth <= 820) {
      infoEl.classList.add('expanded');
    }
  });
});

// Logo kiri atas
document.getElementById('logo').addEventListener('click', (e) => {
  e.preventDefault();
  markInteraction();
  audio.playClick();
  selectEra(0);
});

// Menu overlay fullscreen
const menuEl = document.getElementById('menu');
function toggleMenu(open) {
  const isOpen = typeof open === 'boolean' ? open : !menuEl.classList.contains('open');
  menuEl.classList.toggle('open', isOpen);
  menuEl.setAttribute('aria-hidden', String(!isOpen));
}
document.getElementById('menuBtn').addEventListener('mouseenter', () => audio.playHover());
document.getElementById('menuBtn').addEventListener('click', () => {
  markInteraction();
  audio.playClick();
  toggleMenu(true);
});
document.getElementById('menuClose').addEventListener('mouseenter', () => audio.playHover());
document.getElementById('menuClose').addEventListener('click', () => {

  audio.playClick();
  toggleMenu(false);
});

// Kontrol Audio (Mute/Unmute + Volume Slider)
const audioCtrlEl = document.getElementById('audioCtrl');
const muteBtnEl = document.getElementById('muteBtn');
const volEl = document.getElementById('vol');

function toggleMute() {
  audio.setMuted(!audio.muted);
  audioCtrlEl.classList.toggle('muted', audio.muted);
  showToast(audio.muted ? 'AUDIO MUTED' : 'AUDIO ACTIVE');
}

muteBtnEl.addEventListener('mouseenter', () => audio.playHover());
muteBtnEl.addEventListener('click', () => {
  markInteraction();
  toggleMute();
  if (!audio.muted) audio.playClick();
});

volEl.addEventListener('input', (e) => {
  markInteraction();
  const val = Number(e.target.value);
  volEl.style.setProperty('--v', `${val}%`);
  audio.setVolume(val / 100);
  if (val === 0 && !audio.muted) {
    audio.setMuted(true);
    audioCtrlEl.classList.add('muted');
  } else if (val > 0 && audio.muted) {
    audio.setMuted(false);
    audioCtrlEl.classList.remove('muted');
  }
});

// Glitch visual + suara acak tiap 4–9 detik
const glitchLayer = document.getElementById('glitchLayer');
function scheduleNextGlitch() {
  const delay = CONFIG.timings.glitchMinMs + Math.random() * (CONFIG.timings.glitchMaxMs - CONFIG.timings.glitchMinMs);
  setTimeout(() => {
    if (state.started) {
      triggerRandomGlitch();
    }
    scheduleNextGlitch();
  }, delay);
}

function triggerRandomGlitch() {
  audio.playGlitch();

  // Buat 2-3 garis RGB split horizontal sesaat
  const count = 2 + Math.floor(Math.random() * 2);
  const bars = [];
  for (let i = 0; i < count; i++) {
    const bar = document.createElement('div');
    bar.className = 'gbar';
    bar.style.top = `${10 + Math.random() * 80}%`;
    bar.style.left = `${Math.random() * 35}%`;
    bar.style.width = `${25 + Math.random() * 55}%`;
    bar.style.height = `${2 + Math.random() * 6}px`;
    bar.style.background = i % 2 === 0 ? 'rgba(255,40,90,0.75)' : 'rgba(40,210,255,0.75)';
    glitchLayer.appendChild(bar);
    bars.push(bar);
  }
  frameEl.style.transform = `translate(${(Math.random() - 0.5) * 4}px, 0)`;
  setTimeout(() => {
    bars.forEach((b) => b.remove());
    frameEl.style.transform = '';
  }, 65);
}

/* ============================================================================
   INTERAKSI DRAG KARAKTER (ORBITCONTROLS MANUAL), KEYBOARD & SWIPE MOBILE
   ============================================================================ */
let touchStartX = 0;
let touchStartY = 0;

sceneCanvas.addEventListener('pointerdown', (e) => {
  markInteraction();
  state.isDragging = true;
  state.dragStartX = e.clientX;
  state.dragStartY = e.clientY;
  touchStartX = e.clientX;
  touchStartY = e.clientY;
  sceneCanvas.classList.add('dragging');
});

window.addEventListener('pointermove', (e) => {
  // Parallax mouse global
  state.mouseNX = (e.clientX / window.innerWidth - 0.5) * 2;
  state.mouseNY = (e.clientY / window.innerHeight - 0.5) * 2;

  if (!state.isDragging) return;
  markInteraction();
  const dx = e.clientX - state.dragStartX;
  const dy = e.clientY - state.dragStartY;
  state.dragStartX = e.clientX;
  state.dragStartY = e.clientY;

  state.targetCharYaw += dx * 0.011;
  // Batasi rotasi vertikal (pitch) agar tetap proporsional
  state.targetCamPitch = Math.max(-0.28, Math.min(0.42, state.targetCamPitch + dy * 0.004));
});

window.addEventListener('pointerup', (e) => {
  if (!state.isDragging) return;
  state.isDragging = false;
  sceneCanvas.classList.remove('dragging');

  // Deteksi swipe horizontal cepat di mobile untuk ganti jenjang
  const totalDX = e.clientX - touchStartX;
  const totalDY = e.clientY - touchStartY;
  if (window.innerWidth <= 820 && Math.abs(totalDX) > 65 && Math.abs(totalDY) < 45) {
    audio.playClick();
    if (totalDX < 0) {
      selectEra((state.currentEra + 1) % CONFIG.eras.length);
    } else {
      selectEra((state.currentEra - 1 + CONFIG.eras.length) % CONFIG.eras.length);
    }
  }
});

// Keyboard: ← → untuk ganti jenjang, M untuk mute, Esc untuk tutup menu
window.addEventListener('keydown', (e) => {
  if (!state.started) return;
  markInteraction();
  if (e.key === 'ArrowRight') {
    audio.playClick();
    selectEra((state.currentEra + 1) % CONFIG.eras.length);
  } else if (e.key === 'ArrowLeft') {
    audio.playClick();
    selectEra((state.currentEra - 1 + CONFIG.eras.length) % CONFIG.eras.length);
  } else if (e.key === 'm' || e.key === 'M') {
    toggleMute();
  } else if (e.key === 'Escape' && menuEl.classList.contains('open')) {
    toggleMenu(false);
  }
});

/* ============================================================================
   RESIZE HANDLER & LOOP ANIMASI UTAMA (60FPS)
   ============================================================================ */
function handleResize() {
  const rect = frameEl.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  // Ukuran bloom canvas (setengah resolusi untuk performa tinggi)
  bloomCanvas.width = Math.max(1, Math.floor(w * 0.35));
  bloomCanvas.height = Math.max(1, Math.floor(h * 0.35));
}
window.addEventListener('resize', handleResize);

let introStartTime = 0;
const tmpCamPos = new THREE.Vector3();
const tmpCamLook = new THREE.Vector3();

function animate(now) {
  requestAnimationFrame(animate);
  const t = now * 0.001;

  // 1. Idle Animation Karakter: bernafas pelan (naik-turun dada 0.5%) & goyang kepala halus
  const breathScale = 1 + Math.sin(t * 2.1) * 0.005;
  character.root.scale.set(1, breathScale, 1);
  character.upperBodyPivot.scale.set(breathScale, 1, breathScale);
  character.headGroup.rotation.y = Math.sin(t * 0.95) * 0.045;
  character.headGroup.rotation.z = Math.cos(t * 0.75) * 0.022;

  // 2. Turntable otomatis pelan + damping rotasi manual
  if (!state.isDragging && state.started) {
    state.targetCharYaw += 0.0028;
  }
  state.charYaw += (state.targetCharYaw - state.charYaw) * 0.1;
  state.camPitch += (state.targetCamPitch - state.camPitch) * 0.1;
  character.root.rotation.y = state.charYaw;

  // 3. Partikel debu melayang
  const pAttr = stageEnv.particles.geometry.attributes.position;
  for (let i = 0; i < stageEnv.particleSpeeds.length; i++) {
    let py = pAttr.getY(i) + stageEnv.particleSpeeds[i] * 0.012;
    if (py > 5.2) py = 0.05;
    pAttr.setY(i, py);
  }
  pAttr.needsUpdate = true;

  // 4. Transisi Scan-Line Morph saat berganti outfit
  if (state.morph.active) {
    const elapsed = (now - state.morph.startTime) * 0.001;
    const p = Math.min(1, elapsed / CONFIG.timings.morphDuration);
    const scanY = 0.05 + p * 3.65;

    stageEnv.scanGroup.visible = true;
    stageEnv.scanGroup.position.set(0, scanY, 0);
    stageEnv.scanGroup.rotation.y = t * 6;
    stageEnv.scanLight.intensity = Math.sin(p * Math.PI) * 2.4;

    const fromGrp = character.outfits[state.morph.fromIdx];
    const toGrp = character.outfits[state.morph.toIdx];

    if (fromGrp && state.morph.fromIdx !== state.morph.toIdx) {
      // Outfit lama dissolve + glitch jitter
      const fadeOut = Math.max(0, 1 - p * 1.45);
      fromGrp.position.x = (Math.random() - 0.5) * 0.04 * (1 - p);
      fromGrp.position.z = (Math.random() - 0.5) * 0.03 * (1 - p);
      fromGrp.userData.materials.forEach((m) => {
        m.opacity = fadeOut;
        m.emissive.setHex(CONFIG.colors.neon);
        m.emissiveIntensity = Math.sin(p * Math.PI) * 0.55;
      });
    }

    if (toGrp) {
      // Outfit baru materialize (scale-Y dari bawah + kilau cahaya)
      const easeOut = 1 - Math.pow(1 - p, 3);
      toGrp.scale.y = 0.08 + 0.92 * easeOut;
      toGrp.position.x = 0;
      toGrp.position.z = 0;
      toGrp.userData.materials.forEach((m) => {
        m.opacity = Math.min(1, p * 1.6);
        m.emissive.setHex(CONFIG.colors.neon);
        m.emissiveIntensity = Math.sin(p * Math.PI) * 0.45;
      });
    }

    if (p >= 1) {
      state.morph.active = false;
      stageEnv.scanGroup.visible = false;
      stageEnv.scanLight.intensity = 0;
      character.outfits.forEach((grp, idx) => {
        grp.visible = idx === state.morph.toIdx;
        grp.position.set(0, 0, 0);
        grp.scale.set(1, 1, 1);
        grp.userData.materials.forEach((m) => {
          m.opacity = 1;
          m.emissive.copy(m.userData.baseEmissive);
          m.emissiveIntensity = m.userData.baseEmissiveIntensity;
        });
      });
    }
  }

  // 5. Kamera Sinematik Intro (3 detik naik dari pinggang/kaki ke seluruh badan) & Parallax
  const preset = CAMERA_PRESETS[state.camPresetIndex];
  let introEase = 1;
  if (state.started) {
    const introElapsed = (now - introStartTime) * 0.001;
    const rawP = Math.min(1, introElapsed / CONFIG.timings.introDuration);
    introEase = rawP < 0.5
      ? 4 * rawP * rawP * rawP
      : 1 - Math.pow(-2 * rawP + 2, 3) / 2;
  } else {
    introEase = 0;
  }

  tmpCamPos.lerpVectors(INTRO_START_POS, preset.pos, introEase);
  tmpCamLook.lerpVectors(INTRO_START_LOOK, preset.look, introEase);

  // Tambahkan pengaruh pitch manual & mouse parallax
  tmpCamPos.x += state.mouseNX * 0.16 * introEase;
  tmpCamPos.y += (state.camPitch * 1.15 - state.mouseNY * 0.12) * introEase;

  camera.position.copy(tmpCamPos);
  camera.lookAt(tmpCamLook);

  // Parallax halus pada latar luar jendela & hero
  const pageBg = document.getElementById('page-bg');
  if (pageBg) {
    pageBg.style.transform = `translate3d(${-state.mouseNX * 12}px, ${-state.mouseNY * 10}px, 0)`;
  }

  // 6. Auto-demo bila tidak ada interaksi selama 12 detik
  if (state.started && !menuEl.classList.contains('open') && now - state.lastInteractionTime > CONFIG.timings.autoDemoMs) {
    state.lastInteractionTime = now;
    selectEra((state.currentEra + 1) % CONFIG.eras.length);
    showToast('AUTO-DEMO · NEXT EDUCATION ERA');
  }

  // 7. Render Scene Utama + Efek Bloom/Glow Layer + Mini Preview Kartu
  renderer.render(scene, camera);
  bloomCtx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);
  bloomCtx.drawImage(sceneCanvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
  updateActiveCardPreview(now);
}

/* ============================================================================
   LOADING SCREEN ("INITIALIZING AVATAR...") & TOMBOL MULAI
   ============================================================================ */
function runBootSequence() {
  const loaderEl = document.getElementById('loader');
  const fillEl = document.getElementById('ldFill');
  const stepEl = document.getElementById('ldStep');
  const pctEl = document.getElementById('ldPct');
  const logEl = document.getElementById('ldLog');
  const startBtn = document.getElementById('startBtn');

  const steps = [
    { p: 18, s: 'loading three.js r128 core...', l: '> [OK] Three.js WebGLRenderer initialized' },
    { p: 42, s: 'synthesizing 3d pixar avatar...', l: '> [OK] Stylized Southeast Asian avatar mesh built' },
    { p: 68, s: 'compiling 3 education outfits...', l: '> [OK] Outfits ready: SMP · SMK · UNIMAL' },
    { p: 88, s: 'preparing web audio synthesizer...', l: '> [OK] AudioEngine procedural nodes armed' },
    { p: 100, s: 'system ready — awaiting user input', l: '> [READY] Klik tombol di bawah untuk memulai perjalanan' }
  ];

  let idx = 0;
  function nextStep() {
    if (idx >= steps.length) {
      loaderEl.classList.add('ready');
      return;
    }
    const item = steps[idx++];
    fillEl.style.width = `${item.p}%`;
    stepEl.textContent = item.s;
    pctEl.textContent = `${item.p}%`;
    logEl.textContent += (logEl.textContent ? '\n' : '') + item.l;
    setTimeout(nextStep, 220);
  }
  nextStep();

  function startExperience() {
    if (state.started) return;
    state.started = true;
    introStartTime = performance.now();
    markInteraction();

    // Aktifkan Web Audio API setelah klik pertama
    audio.init();
    audio.playClick();
    audio.playMorph(0);

    loaderEl.classList.add('hide');

    // Tampilkan UI setelah kamera mulai naik
    setTimeout(() => {
      frameEl.classList.add('ui-in');
    }, 650);
  }

  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startExperience();
  });
  loaderEl.addEventListener('click', () => {
    if (loaderEl.classList.contains('ready')) startExperience();
  });
}

// Bersihkan resource Three.js saat halaman ditutup
window.addEventListener('beforeunload', () => {
  disposeObject3D(scene);
  disposableTracker.forEach((r) => {
    if (r && typeof r.dispose === 'function') r.dispose();
  });
  renderer.dispose();
  miniRenderer.dispose();
});

// Jalankan inisialisasi
initGrainBackground();
handleResize();
initUIElements();
scheduleNextGlitch();
runBootSequence();
requestAnimationFrame(animate);
</script>
